name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build exe
        run: uv run pyinstaller --onefile --windowed --name com_monitor --icon icon.ico --add-data "icon.ico;." monitor.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/com_monitor.exe
